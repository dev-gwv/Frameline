name: Deploy

# Deploys api/admin/gallery to Cloudflare on every push to master, after CI passes on that same commit.
# Can also be triggered manually (Actions tab → Deploy → Run workflow) to redeploy without a new commit.
on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # workflow_run fires for every branch's CI run; only continue for master pushes that actually passed.
  gate:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    steps:
      - run: echo "ok"

  deploy-api:
    needs: gate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { ref: master }

      - uses: pnpm/action-setup@v4
        with: { version: 8.10.0 }

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations
        working-directory: apps/api
        run: npx wrangler d1 migrations apply DB --env production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        working-directory: apps/api
        run: npx wrangler deploy --env production --var BUILD_SHA:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-admin:
    needs: gate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: master }

      - uses: pnpm/action-setup@v4
        with: { version: 8.10.0 }

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: apps/admin
        run: pnpm build
        env:
          VITE_API_URL: ${{ vars.API_URL || 'https://frameline-api.dev-d9b.workers.dev' }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/admin/dist --project-name=frameline-admin --branch=master

  deploy-gallery:
    needs: gate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: master }

      - uses: pnpm/action-setup@v4
        with: { version: 8.10.0 }

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: apps/gallery
        run: pnpm build
        env:
          VITE_API_URL: ${{ vars.API_URL || 'https://frameline-api.dev-d9b.workers.dev' }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/gallery/dist --project-name=frameline-gallery --branch=master
